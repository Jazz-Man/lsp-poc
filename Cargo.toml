
[workspace]
resolver = "2"
members = [
    "crates/lsp-poc",
    "crates/zed-md-lsp"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false


[workspace.dependencies]
async-language-server = { git = "https://github.com/Jazz-Man/async-language-server", rev = "v0.0.1", features = ["tracing","tree-sitter"] }
tokio = { version = "1.53.1", features = ["rt","fs","macros"] }


[profile.release]
lto = true


[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_fields_in_debug = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
