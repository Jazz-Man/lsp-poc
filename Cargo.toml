
[workspace]
resolver = "2"
members = [
    "crates/lsp-poc",
    "crates/zed-md-lsp"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false


[workspace.dependencies]
tokio = { version = "1.53.1", features = ["rt","fs","macros"] }

arch-lint = "=0.5.0"


# Consolidated from crates/lsp-poc (owner call 2026-09-12): cargo applies
# profiles only from the workspace root. Zed launches the debug binary; this
# profile exists for release builds of the server.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false


[workspace.lints.clippy]
all = { level = "deny", priority = -3 }
# warn -> deny: CI already promotes warnings to errors via `-D warnings`;
# these levels make local runs and the manifest explicit.
cargo = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }

module_inception = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
unnecessary_wraps = { level = "allow", priority = 1 }

# Restriction lints, measured at zero fires on this codebase.
print_stdout = "warn"                # stdout is the protocol channel over stdio
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
exit = "warn"                        # a library must not kill the process
undocumented_unsafe_blocks = "warn"  # crate is 100% safe code today
multiple_unsafe_ops_per_block = "warn"
allow_attributes_without_reason = "warn"  # encodes the suppression policy
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
verbose_file_reads = "warn"
clone_on_ref_ptr = "warn"
integer_division = "warn"
error_impl_error = "warn"
self_named_module_files = "warn"     # locks in the mod.rs layout

# Fires today, adopted as explicit work items (see clippy.toml thresholds).
str_to_string = "warn"
cognitive_complexity = "warn"

# Takes over arch-lint's no-unwrap-expect rule, test-aware via clippy.toml.
expect_used = "deny"
unwrap_used = "deny"


[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dylint_lib, values(any()))"] }
