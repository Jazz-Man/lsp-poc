[package]
name = "php-lsp"
version = "0.1.0"
edition = "2021"
description = "PHP Language Server Protocol implementation"

[dependencies]
async-lsp = "0.2.2"
tokio = { version = "1.0", features = ["full"] }
tree-sitter = "0.24.2"
tree-sitter-php = "0.24.2"
ropey = "1.6"
lsp-types = "0.97"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
url = "2.0"
dashmap = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"