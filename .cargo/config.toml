# Project-local Cargo settings.
#
# [build] rustflags denies warnings on every cargo-driven compilation (build,
# check, test, clippy) — owner policy (2026-09-20), mirroring the upstream
# crate. Commands never repeat `-D warnings`; it arrives here, once.
#
# The shared-`target/` invariant with rust-analyzer holds BECAUSE the flag
# lives in this file: the CLI and rust-analyzer's flycheck both run cargo,
# which reads this config, so their metadata hashes agree. The divergence
# that forces a full dep-tree rebuild comes from setting RUSTFLAGS on one
# side only (an env var, a Makefile flag) — don't.
#
# If you genuinely need more RUSTFLAGS (or a custom linker), also set
#   cargo.targetDir = true
# in .lsp.json and .zed/settings.json so rust-analyzer builds in its own target
# dir and stops fighting the CLI.

[build]
rustflags = ["-D", "warnings"]

[alias]
# Lean-output lint: short machine-parseable diagnostics, no color codes —
# keeps agent/CI terminal output (and token burn) minimal.
lint = "clippy --workspace --all-targets --message-format=short"

[env]
# RA sync debug knob: "0" leaves incremental sync on; flip to "1" to freeze it
# while inspecting which config rust-analyzer applies on startup.
RA_DISABLE_INCREMENTAL_SYNC = "0"

# Miri interpreter flags for `make miri`. MIRIFLAGS is the interpreter's env
# var, not RUSTFLAGS — the shared-target invariant above is untouched.
MIRIFLAGS = "-Zmiri-backtrace=full -Zmiri-disable-isolation"
